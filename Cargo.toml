[workspace]
members = ["."]
resolver = "2"

[package]
name = "engram"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Agent Engram MCP daemon"
license = "MIT"
publish = false

authors = ["Engram Contributors"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
rmcp = { version = "1.1", features = ["server", "transport-io"] }
interprocess = { version = "2", features = ["tokio"] }
fd-lock = "4"
notify = "9.0.0-rc.2"
notify-debouncer-full = "0.7.0"
cozo = { version = "0.7", features = ["storage-sqlite"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.10"
fastembed = { version = "5", optional = true, default-features = false }
tracing-opentelemetry = { version = "0.26", optional = true }
opentelemetry = { version = "0.26", optional = true }
opentelemetry_sdk = { version = "0.26", optional = true, features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.26", optional = true, features = ["grpc-tonic"] }
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
similar = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
tokio-stream = "0.1"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.30"
tempfile = "3"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-swift = "=0.7.1"
tree-sitter-sequel = "0.3"
ignore = "0.4"
globset = "0.4"
serde_yaml = "0.9"
git2 = { version = "0.19", optional = true, default-features = false }

[features]
default = ["embeddings", "cozo-backend"]
embeddings = ["fastembed", "fastembed/ort-download-binaries-native-tls", "fastembed/hf-hub-native-tls"]
# cozo-backend: CozoDB embedded via SQLite.
cozo-backend = ["cozo"]
git-graph = ["git2"]
otlp-export = ["tracing-opentelemetry", "opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp"]
# Enables the legacy HTTP/SSE transport layer (axum router, MCP HTTP handler, SSE handler).
# Not required for normal operation; the daemon uses IPC transport by default.
# See docs/adrs/0016-legacy-sse-feature-gate.md.
legacy-sse = []

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.test.build-override]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[profile.debugging.build-override]
debug = false

[dev-dependencies]
proptest = "1"
tokio-test = "0.4"
serial_test = "3"

# Rayon is pinned below 1.11 to work around graph_builder 0.4.1's
# `.into_par_iter().copied()` breakage introduced in rayon 1.11.
# See docs/decisions/2026-04-19-cozo-storage-backend.md §Known dependency issue.
# Remove this pin once graph/graph_builder is updated upstream or cozo
# migrates away from graph_builder.
rayon = ">=1.0, <1.11"

