[build]
rustflags = ["-Dwarnings"]

[alias]
# `dev-test` is the canonical local merge gate. It is change-scoped: rather than
# a fixed allowlist, it runs the test targets a coverage oracle derives from the
# current diff, under an explicit concurrency bound (Feature 126-F, stash
# C2413934). On Linux/macOS the alias resolves to the `cargo-devtest` external
# subcommand (scripts/cargo-devtest); add `scripts/` to PATH once so cargo can
# find it. On Windows, cargo does not resolve script-based external subcommands,
# so use the wrapper `pwsh scripts/dev-test.ps1` instead. Either way the runner
# invokes scripts/test-coverage-oracle.{sh,ps1} --mode run; you can also call
# that directly:
#   bash  scripts/test-coverage-oracle.sh  --mode run   (Linux/macOS)
#   pwsh  scripts/test-coverage-oracle.ps1 --mode run   (Windows)
# `full-test` and `ci` are unchanged and remain the exhaustive backstop.
dev-test = "devtest"
full-test = "test"
debug-build = "build --profile debugging"
debug-test = "test --profile debugging --lib"
debug-full-test = "test --profile debugging"
fmt-check = "fmt --all -- --check"
lint = "clippy --all-targets --all-features -- -D warnings -D clippy::pedantic"
ci = "test --all-targets --all-features"

[env]
RUST_BACKTRACE = "1"
# Bounded execution tunables (U4). These override the [settings] defaults in
# .cargo/test-coverage-manifest.toml when set. `MAX_BINARIES` caps how many test
# binaries the change-scoped runner executes concurrently; `TEST_THREADS` is
# passed to each binary as `--test-threads`, so the process budget is an
# explicit, tunable parameter rather than an emergent consequence of the target
# count.
ENGRAM_DEVTEST_MAX_BINARIES = "8"
ENGRAM_DEVTEST_TEST_THREADS = "4"
