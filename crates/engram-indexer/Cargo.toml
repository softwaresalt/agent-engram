[package]
name = "engram-indexer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Engram out-of-process indexing supervisor (structural stub; F12a)"
license = "MIT"
publish = false

[[bin]]
name = "engram-indexer"
path = "src/main.rs"

[features]
# Forward the root engram feature set so a dependent that opts out of defaults (for example the root
# crate's dev-dependency used by the preflight integration harness) does not silently re-enable them.
default = ["embeddings", "cozo-backend"]
embeddings = ["engram/embeddings"]
cozo-backend = ["engram/cozo-backend"]

[dependencies]
engram = { path = "../..", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
tempfile = "3"
