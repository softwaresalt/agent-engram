# autoharness Configuration
#
# Resolved harness configuration for this workspace.
# Written by autoharness install; updated by autoharness tune.
# Operator edits to this file are preserved on re-install and tuning.
#
# Schema: schemas/harness-config.schema.json

schema_version: "1.1.0"

# Installation preset: starter | standard | full
preset: full

# Additive stack classification used for composition
primary_stack_pack: rust-mcp-daemon
stack_packs: ["rust-mcp-daemon", "rust-surrealdb-embedded", "rust-tree-sitter", "github-actions-ci"]

# Explicit artifact-class layers selected for installation
install_layers: ["foundation", "instructions", "workflow", "review", "runtime", "backlog", "knowledge", "overlays"]

# Capability packs enabled for this workspace
capability_packs: ["agent-engram", "backlogit", "strict-safety", "release-observability", "continuous-learning", "adversarial-review"]

# Backlog tool configuration
backlog:
  tool: backlogit
  directory: .backlogit
  suffix_map:
    feature: "F"
    chore: "C"
    task: "T"
    spike: "SP"
    deliberation: "D"
    bug: "B"
    epic: "E"
    subtask: "ST"
    shipment: "S"

# Long-lived knowledge artifact directories
docs:
  root: docs
  subdirectories:
    compound: compound
    plans: exec-plans
    decisions: decisions
    memory: memory
    closure: closure
    design_docs: research
    product_specs: research

# Optional continuous-learning capability-pack configuration
continuous_learning:
  directory: ".autoharness/continuous-learning"
  capture_hooks: false
  environment_adapter: "none"
  promotion_threshold: 3

# Optional strict-safety capability-pack configuration
strict_safety:
  enabled: true
  require_approval_for:
    - destructive

# Model routing preferences (map tiers to model identifiers and per-tier config)
model_routing:
  tier1:
    model: gpt-6-luna
    reasoning_effort: "xhigh"
    model_provider: "openai" # e.g., openai, anthropic — leave empty for default
    model_family: "gpt-6-luna" # Resolved into Tier 1 agent frontmatter
  tier2:
    model: claude-sonnet-5.5              # Standard: orchestration, code, review (e.g., claude-sonnet-5)
    reasoning_effort: "high"
    model_provider: "anthropic"
    model_family: "claude-sonnet-5.5"
  tier3:
    model: claude-opus-5.5              # Frontier: planning, architecture, analysis (e.g., claude-opus-5)
    reasoning_effort: "high"
    model_provider: "anthropic"
    model_family: "claude-opus-5.5"
  orchestrator:
    model_family: "claude-opus-5.5"
    model_provider: "anthropic"
    reasoning_effort: "high"
  # P-013.5: role routes — dogfood assignment (Stage -> claude-opus-5, Ship -> claude-sonnet-5)
  stage:
    model_family: "claude-opus-5.5"             # Stage role route (falls back to tier3 when empty)
    model_provider: "anthropic"
    reasoning_effort: "high"
  ship:
    model_family: "gpt-6-luna"
    model_provider: "openai"
    reasoning_effort: "xhigh"
  # P-013.6: explicit escalation route — distinct vendor/family from the
  # Stage role route (claude-opus-5/anthropic, already == tier3) so an
  # auto-escalation attempt is a genuine escalation, not a same-route no-op
  # (ESCALATION_DEGRADED guard, 011-DL(b)/106-F).
    escalation:
      model_family: "claude-sonnet-5.5"
      model_provider: "anthropic"
      reasoning_effort: "high"
  anchor_review:
    model_provider: "openai"       # Anchor reviewer provider (default: openai)
    model_family: "gpt-6-sol"           # Anchor reviewer family (default: gpt-5.6-sol)
    reasoning_effort: "high"  # Leave empty to use model default

# AI CLI tool startup configuration
# Resolves the copilot executable in the generated start.ps1 and start.sh scripts,
# and is read directly by `autoharness run`. Set exe_path to the full path if
# copilot is not on PATH. Use args for flags that should always be passed.
ai_tools:
  copilot_cli:
    exe_path: "copilot"  # Default: "copilot" (expects it on PATH)
                                      # Example: "C:\\Tools\\ghcpcli\\copilot.exe"
    args: []             # Default: []

# Sidecar syncs `autoharness run` performs before launching the AI CLI tool.
# Derived from the capability packs enabled for this workspace.
sidecars: ["backlogit", "engram"]

# Optional browser-automation capability configuration (used when browser-verification is enabled)
browser:
  cli: "agent-browser"                    # Default: "agent-browser"
  headless_flag: "--headless" # Default: "--headless"

# Optional iterative-experiment skill configuration
experiments:
  branch_prefix: "experiment/"  # Default: "experiment/"
  results_dir: "docs/experiments"       # Default: "docs/experiments"

# Explicit template variable overrides applied during install/tune (use sparingly —
# prefer fixing the workspace setup over overriding discovery results)
overrides: {}

# ---------------------------------------------------------------------------
# Optional: Deterministic validation gates (lifecycle_hooks + telemetry)
# ---------------------------------------------------------------------------
# The ENTIRE lifecycle_hooks block is OPTIONAL and disabled by default.
# When absent, no gates run and behavior is identical to an install without
# gates (fail-open-to-current). Validated against
# schemas/validation-gates/1.0.0.schema.json. See docs/gates-reference.md.
#
# KILL-SWITCH: remove or empty this block to disable all gating with zero code
# change.
#
# Uncomment and adapt to enable. Only the closed placeholder vocabulary
# {file_path}, {task_id}, {result} is permitted in command/write_back strings.
#
