# =============================================================================
# Languages
# =============================================================================
languages:
  primary:
    name: Rust
    version: "1.85"
    edition: "2024"
    toolchain: stable
    file_count: 87  # src/*.rs
  secondary:
    - name: Markdown
      file_count: 718  # git-tracked .md files only (excludes untracked/generated)
      purpose: documentation, agent instructions, skills, backlog artifacts
    - name: PowerShell
