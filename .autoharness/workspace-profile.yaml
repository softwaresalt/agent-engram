conventions:
  code_style:
    error_handling: "Result<T, EngramError> for all fallible operations; propagate with ?; never unwrap() or expect()"
    naming: "snake_case for functions and variables, PascalCase for types and traits, SCREAMING_SNAKE_CASE for constants"
    documentation: "/// doc comments on all public items, //! for module-level documentation"
    safety: "#![forbid(unsafe_code)]; clippy pedantic warnings are hard errors"
  git:
    commit_style: "Conventional Commits"
    branch_naming: "number-prefixed feature branches (e.g. 016-mcp-sandbox-policy-engine); chore/* for harness maintenance"
    merge_strategy: "merge commit only (squash and rebase merges are forbidden — P-009)"
    release_automation: "cargo-release with git-cliff changelog generation"
  documentation:
    architecture: "docs/ARCHITECTURE.md"
    adrs: "docs/adrs/"
    progressive_disclosure: true

