# =============================================================================
strict_safety_signals:
  detected: true
  evidence:
    - signal: "forbid(unsafe_code)"
      source: "src/lib.rs:10"
      scope: crate-level
    - signal: "clippy::pedantic deny"
      source: ".cargo/config.toml alias: lint"
      scope: workspace
    - signal: "unwrap_used deny, expect_used deny"
      source: "AGENTS.md: workspace lints"
      scope: workspace
    - signal: "-Dwarnings rustflags"
      source: ".cargo/config.toml:2"
      scope: build
    - signal: "Result<T, EngramError> pattern"
      source: "src/errors/mod.rs"
      scope: crate
    - signal: "Constitution Principle I: Safety-First Rust"
      source: ".github/instructions/constitution.instructions.md"
      scope: project governance
    - signal: "Workspace Isolation & Security Boundaries (Principle IV)"
      source: ".github/instructions/constitution.instructions.md"
      scope: project governance
    - signal: "CLI Workspace Containment (Principle VII)"
      source: "AGENTS.md"
      scope: project governance

