    - name: YAML
      file_count: ~5
      purpose: CI workflows, backlogit config, engram registry

# =============================================================================
# Frameworks & Libraries
# =============================================================================
frameworks:
  - name: axum
    version: "0.7"
    purpose: HTTP server, SSE transport (legacy-sse feature)
  - name: tokio
    version: "1"
    features: ["full"]
    purpose: async runtime
  - name: rmcp
    version: "1.1"
    features: ["server", "transport-io"]
    purpose: MCP SDK for JSON-RPC 2.0 / stdio transport
  - name: surrealdb
    version: "2"
    features: ["kv-surrealkv"]
    purpose: embedded graph database, per-workspace namespace
  - name: tree-sitter
    version: "0.25"
    purpose: "code graph parsing (multi-language: Rust, Python, JS, TS, Go, C#, C, C++, Swift)"
  - name: tree-sitter-rust
    version: "0.23"
    purpose: Rust language grammar for tree-sitter
  - name: serde
    version: "1"
    features: ["derive"]
    purpose: serialization/deserialization
  - name: clap
    version: "4"
    features: ["derive", "env"]
    purpose: CLI argument parsing with ENGRAM_ env prefix
  - name: fastembed
    version: "5"
    optional: true
    feature_flag: embeddings
    purpose: embedding generation for semantic search
  - name: similar
    version: "2"
    purpose: structured diff merge during dehydration
  - name: pulldown-cmark
    version: "0.10"
    purpose: markdown parsing for .engram/ files
  - name: git2
    version: "0.19"
    optional: true
    feature_flag: git-graph
    purpose: git commit history graph indexing
  - name: cozo
    version: "0.7"
    features: ["storage-sqlite"]
    optional: true
    feature_flag: cozo-backend
    purpose: CozoDB embedded graph database (migration target)
  - name: interprocess
    version: "2"
    features: ["tokio"]
    purpose: IPC via named pipes (Windows) / Unix domain sockets
  - name: notify
    version: "9.0.0-rc.2"
    purpose: file system watcher for incremental sync

mcp_sdk: rmcp
mcp_sdk_version: "1.1"
mcp_transport: stdio-ipc  # primary: IPC via named pipe; legacy-sse feature for HTTP/SSE

# =============================================================================
# Stack Packs
# =============================================================================
primary_stack_pack: rust-mcp-daemon
stack_packs:
  - rust-mcp-daemon          # primary: Rust MCP server with IPC transport
  - rust-surrealdb-embedded  # embedded SurrealDB persistence
  - rust-tree-sitter         # code graph parsing
  - github-actions-ci        # CI/CD via GitHub Actions

# =============================================================================
# Build
# =============================================================================
build:
  tool: cargo
  command: "cargo build"
  check_command: "cargo check"
  release_command: "cargo build --release"
  features:
    default: ["embeddings", "surreal-backend"]
    optional:
      - embeddings
      - surreal-backend
      - cozo-backend
      - git-graph
      - legacy-sse
      - otlp-export
  binary_name: engram
  binary_path: "src/bin/engram.rs"

# =============================================================================
# Test
# =============================================================================
test:
  runner: cargo
  command: "cargo dev-test"
  all_features_command: "cargo ci"  # alias for cargo test --all-targets --all-features
  directory: "tests/"
  tiers:
    - name: contract
      path: "tests/contract/"
      file_count: 26
      purpose: MCP tool response contract verification
    - name: integration
      path: "tests/integration/"
      file_count: 50
      purpose: end-to-end flows with real DB/IPC
    - name: unit
      path: "tests/unit/"
      file_count: 24
      purpose: isolated logic, property-based tests (proptest)
    - name: helpers
      path: "tests/helpers/"
      file_count: 2
      purpose: shared test harness utilities
  total_test_files: 102
  dev_dependencies:
    - proptest: "1"
    - tokio-test: "0.4"
    - rayon: ">=1.0, <1.11"  # dev-dependency pin for parallel test execution
  notes:
    - "tempfile 3 is a production dependency (used in daemon lockfile management), not dev-only"

# =============================================================================
# Lint
# =============================================================================
lint:
  tool: clippy
  command: "cargo clippy -- -D warnings -D clippy::pedantic"
  alias_command: "cargo lint"  # alias in .cargo/config.toml
  crate_level_attributes:
    - "#![forbid(unsafe_code)]"
    - "#![warn(clippy::pedantic)]"
  workspace_lints:
    unsafe_code: deny
    missing_docs: warn
    clippy_pedantic: deny
    clippy_unwrap_used: deny
    clippy_expect_used: deny
  rustflags: ["-Dwarnings"]

# =============================================================================
# Format
# =============================================================================
format:
  tool: rustfmt
  command: "cargo fmt --all"
  check_command: "cargo fmt --all -- --check"
  alias_command: "cargo fmt-check"  # alias in .cargo/config.toml
  config_file: null  # no rustfmt.toml; uses defaults

# =============================================================================
# CI/CD
# =============================================================================
ci:
  platform: github-actions
  pipeline_files:
    - ".github/workflows/ci.yml"
    - ".github/workflows/release.yml"
  pipeline_steps:
    ci:
      - name: fmt
        command: "cargo fmt --all -- --check"
      - name: clippy
        command: "cargo clippy --all-targets -- -D warnings -D clippy::pedantic"
      - name: test
        command: "cargo test --all-targets"
      - name: audit
        command: "cargo audit"
        continue_on_error: true
    release:
      - name: quality-gates
        steps: [fmt, clippy, test]
      - name: changelog
        tool: git-cliff
      - name: cross-platform-build
        targets:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
      - name: publish-github-release
        tool: softprops/action-gh-release
  quality_gates:
    - "cargo fmt --all -- --check"
    - "cargo clippy -- -D warnings -D clippy::pedantic"
    - "cargo test"
  notes:
    - "CI runs on ubuntu-latest; release builds are cross-platform"
    - "Actions not SHA-pinned (uses @v4 tags) — differs from hve-core convention"
    - "cargo-audit runs with continue-on-error: true"
    - "cargo-release configured in release.toml (tag format: v{{version}}, branch: main only)"
    - "Local developer default test command is cargo dev-test; full validation remains cargo test / cargo ci"

# =============================================================================
# Project Structure
# =============================================================================
structure:
  source_layout:
    root: "src/"
    binary: "src/bin/engram.rs"
    library: "src/lib.rs"
    modules:
      - config      # Config struct (port, timeout, data_dir, log_format) via clap
      - daemon      # IPC server, lockfile, protocol, TTL, watcher, debounce
      - db          # SurrealDB + CozoDB backends, schema bootstrap, queries, workspace hashing
      - errors      # EngramError enum, u16 error codes
      - installer   # Install/update/uninstall commands, templates
      - models      # Domain models (CodeFile, Function, Class, Interface, Policy, etc.)
      - server      # Router, SSE handler, MCP handler, state (legacy-sse feature)
      - services    # Business logic (code_graph, hydration, dehydration, search, parsing/*, etc.)
      - shim        # Stdio shim: IPC client, transport, tools catalog, lifecycle, pidfile
      - tools       # MCP tool dispatch: lifecycle, read, write, doctor
    source_file_count: 87
  test_layout:
    root: "tests/"
    tiers:
      - contract    # 26 files — MCP tool contract tests
      - integration # 50 files — end-to-end flows
      - unit        # 24 files — isolated logic, proptest
      - helpers     # 2 files — shared test utilities
    test_file_count: 102
  doc_layout:
    root: "docs/"
    subdirectories:
      - adrs          # 17 Architecture Decision Records
      - archive       # compacted and archived artifacts
      - closure       # closure reports
      - compound      # compound knowledge
      - decisions     # decision records
      - exec-plans    # execution plans
      - memory        # session memory
      - research      # research documents
      - reviews       # code reviews
      - upstream      # upstream tool issue documentation
    key_files:
      - "docs/architecture.md"
      - "docs/configuration.md"
      - "docs/quickstart.md"
      - "docs/mcp-tool-reference.md"
      - "docs/troubleshooting.md"
      - "docs/log-observation-guide.md"
    adr_count: 17
  scripts_layout:
    root: "scripts/"
    subdirectories:
      - metrics
    files:
      - "scripts/run-local.ps1"
  other_notable:
    - "AGENTS.md"
    - "CHANGELOG.md"
    - "README.md"
    - "LICENSE"
    - "release.toml"
    - "start.ps1"
    - "agent-engram.code-workspace"
    - ".gitmodules"         # hve-core submodule
    - ".mcp.json"           # MCP server configuration

# =============================================================================
# Runtime Surfaces
# =============================================================================
runtime_surfaces:
  web_ui: false
  public_api: false  # localhost-only MCP daemon; no public HTTP API
  background_jobs: true  # daemon runs as persistent background service
  browser_tooling: false
  deployment_manifests: false  # no Docker, k8s, or cloud deploy manifests
  notes:
    - "Daemon binds to 127.0.0.1 only (security boundary)"
    - "Transport: IPC via named pipe (Windows) / Unix domain socket"
    - "Legacy HTTP/SSE transport behind legacy-sse feature flag"
    - "Single binary distribution via GitHub Releases"

# =============================================================================
# Conventions
# =============================================================================
conventions:
  code_style:
    formatter: rustfmt (defaults, no rustfmt.toml)
    linter: clippy pedantic with deny warnings
    rustflags: ["-Dwarnings"]
    unsafe_code: forbidden (#![forbid(unsafe_code)])
    unwrap_expect: denied (workspace lints)
    error_handling: "Result<T, EngramError> pattern via thiserror"
    error_codes: "u16 codes: 1xxx workspace, 2xxx hydration, 4xxx query, 5xxx system, 7xxx code graph"
    module_pattern: "src/{module}/mod.rs for directories"
    id_format: "prefixed strings (fn:uuid, class:uuid, file:uuid)"
    serde_convention: '#[serde(rename_all = "snake_case")] on enums'
    visibility_default: "pub(crate) unless public API"
    doc_comments: "/// on all public items, //! on module files"
    editorconfig: false
    markdownlint: false  # no .markdownlint config found
  git:
    commit_format: conventional-commits
    commit_types: [feat, fix, refactor, perf, style, test, docs, build, ops, chore]
    commit_scopes: [agents, prompts, instructions, skills, templates, workflows, extension, scripts, docs, adrs, settings, build]
    branch_pattern: "feature-number-prefixed (e.g., 016-mcp-sandbox-policy-engine)"
    default_branch: main
    release_tool: cargo-release
    release_tag_format: "v{{version}}"
    changelog_tool: git-cliff
    recent_branches:
      - main
      - backlogit_migration
      - 018-atomic-workspace-config-snapshot-toctou
      - 016-mcp-sandbox-policy-engine
      - 012-harness-resilience-and-workflow-pipeline
      - 010-effectiveness-metrics-token-usage-tracking
  documentation:
    readme: true
    changelog: true
    adr_directory: "docs/adrs/"
    adr_count: 17
    quickstart: "docs/quickstart.md"
    tool_reference: "docs/mcp-tool-reference.md"
    troubleshooting: "docs/troubleshooting.md"
    architecture: "docs/architecture.md"
    rustdoc: "/// doc comments on public items"
    constitution: ".github/instructions/constitution.instructions.md"

