name: Verify Published Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published SemVer tag beginning with v
        required: true
        type: string
      expected_commit:
        description: Exact 40-hex commit targeted by the tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-assets-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Validate input formats
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          $ErrorActionPreference = "Stop"
          $identifier = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          $tagPattern = "^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-$identifier(?:\.$identifier)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$"
          if ($env:TAG -cnotmatch $tagPattern) {
            throw "tag must be a complete SemVer value beginning with v"
          }
          if ($env:EXPECTED_COMMIT -cnotmatch '^[0-9A-Fa-f]{40}$') {
            throw "expected_commit must be exactly 40 hexadecimal characters"
          }

      - name: Checkout validated release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag target and published release
        id: release
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          git show-ref --verify --quiet "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "validated tag ref is missing after checkout"
          }

          $tagCommit = (git rev-parse "refs/tags/$($env:TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "tag cannot be peeled to a commit"
          }
          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "checked-out commit cannot be resolved"
          }
          $expectedCommit = $env:EXPECTED_COMMIT.ToLowerInvariant()
          if ($tagCommit -cne $expectedCommit -or $headCommit -cne $expectedCommit) {
            throw "checkout and peeled tag target must equal expected_commit"
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $encodedTag = [uri]::EscapeDataString($env:TAG)
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          $release = Invoke-RestMethod -Uri $releaseUri -Headers $headers
          if ($release.tag_name -cne $env:TAG -or $release.draft -ne $false) {
            throw "matching non-draft GitHub Release was not found"
          }
          $releaseId = [string]$release.id
          if ($releaseId -cnotmatch '^[0-9]+$') {
            throw "release API returned an invalid release id"
          }

          "tag=$env:TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "commit=$tagCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_id=$releaseId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Validated release tag, commit, and non-draft release."

  verify:
    name: Verify ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            runner_arch: X64
            runner_os: Linux
            archive_suffix: .tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            runner_arch: X64
            runner_os: Windows
            archive_suffix: .zip
          - runner: macos-latest
            target: aarch64-apple-darwin
            runner_arch: ARM64
            runner_os: macOS
            archive_suffix: .tar.gz
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert native runner and checkout identity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_RUNNER_OS: ${{ matrix.runner_os }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RUNNER_ARCH -cne $env:EXPECTED_RUNNER_ARCH) {
            throw "runner architecture does not match the release target"
          }
          if ($env:RUNNER_OS -cne $env:EXPECTED_RUNNER_OS) {
            throw "runner operating system does not match the release target"
          }

          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "native checkout commit cannot be resolved"
          }
          $tagCommit = (git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "native checkout tag cannot be peeled to a commit"
          }
          if ($headCommit -cne $env:EXPECTED_COMMIT -or $tagCommit -cne $env:EXPECTED_COMMIT) {
            throw "native checkout does not match the validated tag target"
          }
          Write-Host "Validated native runner and exact tag target."

      - name: Download and verify exact release asset
        id: asset
        shell: pwsh
        env:
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          $release = Invoke-RestMethod -Uri $releaseUri -Headers $headers
          if ($release.tag_name -cne $env:RELEASE_TAG -or $release.draft -ne $false) {
            throw "validated release identity changed"
          }

          $assetName = "engram-$env:RELEASE_TAG-$env:TARGET$env:ARCHIVE_SUFFIX"
          $matchingAssets = @($release.assets | Where-Object { $_.name -ceq $assetName })
          if ($matchingAssets.Count -ne 1) {
            throw "release must contain exactly one expected asset"
          }
          $assetId = [string]$matchingAssets[0].id
          if ($assetId -cnotmatch '^[0-9]+$') {
            throw "asset API returned an invalid asset id"
          }

          $assetUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$assetId"
          $asset = Invoke-RestMethod -Uri $assetUri -Headers $headers
          if (
            [string]$asset.id -cne $assetId -or
            $asset.name -cne $assetName -or
            [string]$asset.url -cne $assetUri
          ) {
            throw "exact asset metadata does not match its release entry"
          }
          $apiDigest = [string]$asset.digest
          if ($apiDigest -cnotmatch '^sha256:[0-9a-f]{64}$') {
            throw "asset API must provide a SHA-256 digest"
          }
          [long]$expectedSize = 0
          if (
            -not [long]::TryParse([string]$asset.size, [ref]$expectedSize) -or
            $expectedSize -le 0
          ) {
            throw "asset API must provide a positive byte size"
          }

          $archivePath = Join-Path $PWD $assetName
          $downloadHeaders = $headers.Clone()
          $downloadHeaders["Accept"] = "application/octet-stream"
          Invoke-WebRequest -Uri $assetUri -Headers $downloadHeaders -OutFile $archivePath

          $actualSize = (Get-Item -LiteralPath $archivePath).Length
          if ($actualSize -ne $expectedSize) {
            throw "downloaded asset size does not match API metadata"
          }
          $actualDigest = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -cne $apiDigest.Substring(7)) {
            throw "downloaded asset digest does not match API metadata"
          }

          "archive=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Verified asset target=$env:TARGET bytes=$actualSize sha256=$actualDigest"

      - name: Smoke test downloaded release archive
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.asset.outputs.archive }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          TARGET: ${{ matrix.target }}
          WORK_DIR: ${{ runner.temp }}/engram-release-smoke-${{ matrix.target }}
        run: |
          python scripts/verify-release-archive.py `
            --archive "$env:ARCHIVE" `
            --tag "$env:RELEASE_TAG" `
            --target "$env:TARGET" `
            --work-dir "$env:WORK_DIR" `
            --mcp
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
