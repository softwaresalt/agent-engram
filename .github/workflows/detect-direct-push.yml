name: Detect direct push to main

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  warn-direct-push:
    name: Warn on direct push
    runs-on: ubuntu-latest
    steps:
      - name: Check for direct push
        run: |
          echo "::warning::Direct push to '${{ github.ref_name }}' detected."
          echo "All changes should arrive via pull request."
          echo "Merges must use merge commits (see the repository constitution, Principle XI)."
