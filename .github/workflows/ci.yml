name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --no-default-features --features cozo-backend,embeddings --all-targets -- -D warnings -D clippy::pedantic

      - name: test
        # Advisory: cozo-0.7.6 has an unwrap() in open_sqlite_db() that panics when
        # multiple daemon processes open the same SQLite file concurrently (U015-FLK1).
        # The fd-lock in connect_db serialises DbInstance::new() to prevent the
        # multi-process panic, but schema bootstrap still runs after the lock releases.
        # Parallel tests (e.g. set_workspace + index_workspace on the same DB path)
        # can hit SQLITE_BUSY during concurrent schema writes — intra-process variant
        # of U015-FLK1. Tracked in stash C4E8F2A1 (extend fd-lock scope to cover
        # schema bootstrap) and 1092D3D6 (cozo 0.8+ upgrade).
        continue-on-error: true
        run: cargo test --no-default-features --features cozo-backend,embeddings --all-targets

      - name: audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
