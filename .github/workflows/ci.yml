name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: surreal-backend
            features: "--no-default-features --features surreal-backend,embeddings"
            cozo_advisory: false
          - backend: cozo-backend
            features: "--no-default-features --features cozo-backend,embeddings"
            cozo_advisory: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        if: matrix.backend == 'surreal-backend'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy ${{ matrix.features }} --all-targets -- -D warnings -D clippy::pedantic

      - name: test
        if: matrix.backend == 'surreal-backend'
        run: cargo test ${{ matrix.features }} --all-targets

      - name: test (cozo-backend)
        if: matrix.backend == 'cozo-backend'
        # Run tests single-threaded within each binary to reduce SQLite lock
        # contention from concurrent daemon spawns. Each test binary still runs
        # in parallel; spawn timeouts are set to 30 s to accommodate CozoDB
        # schema bootstrap on SQLite under CI load.
        run: cargo test ${{ matrix.features }} --all-targets -- --test-threads 1

      - name: audit
        if: matrix.backend == 'surreal-backend'
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
