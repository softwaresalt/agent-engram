name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --no-default-features --features cozo-backend,embeddings --all-targets -- -D warnings -D clippy::pedantic

      - name: test
        # U015-FLK1 resolved (037-F): fd-lock covers DbInstance::new() and
        # run_schema_bootstrap(); startup auto-sync retries on SQLITE_BUSY.
        # continue-on-error retained for pre-existing unrelated failures:
        #   - integration_graph_vector_rehydration: startup-index timeout (timing-sensitive)
        #   - integration_query_perf_observability: timing-stat buckets not populated
        # Red-phase tests (s085-s088) marked #[ignore] until record_file_hash
        # is wired into index_workspace_inner.
        continue-on-error: true
        run: cargo test --no-default-features --features cozo-backend,embeddings --all-targets

      - name: audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
