name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: surreal-backend
            features: "--no-default-features --features surreal-backend,embeddings"
          - backend: cozo-backend
            features: "--no-default-features --features cozo-backend,embeddings"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: fmt
        if: matrix.backend == 'surreal-backend'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy ${{ matrix.features }} --all-targets -- -D warnings -D clippy::pedantic

      - name: test
        if: matrix.backend == 'surreal-backend'
        run: cargo test ${{ matrix.features }} --all-targets

      - name: Install cargo-nextest
        if: matrix.backend == 'cozo-backend'
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: test (cozo-backend)
        if: matrix.backend == 'cozo-backend'
        # nextest --test-threads 1 serialises all test executions globally,
        # preventing concurrent CozoDB SQLite access across test binaries.
        # Excludes s_cs1/s_cs4: those tests intentionally exercise concurrent
        # daemon access and trigger the upstream cozo-0.7.6 SQLite panic (U015-FLK1);
        # they are run separately below as advisory.
        run: cargo nextest run ${{ matrix.features }} --test-threads 1 -E 'not (test(s_cs1_three_concurrent_health_checks_succeed) or test(s_cs4_concurrent_indexing_serialised_by_in_progress_flag))'

      - name: test (cozo-backend, advisory)
        if: matrix.backend == 'cozo-backend'
        # Advisory: s_cs1 and s_cs4 intentionally test concurrent daemon access;
        # the upstream cozo-0.7.6 SQLite panic fires by design (U015-FLK1).
        # Tracked for follow-up: upgrade cozo or switch to WAL mode.
        continue-on-error: true
        run: cargo nextest run ${{ matrix.features }} -E 'test(s_cs1_three_concurrent_health_checks_succeed) or test(s_cs4_concurrent_indexing_serialised_by_in_progress_flag)'

      - name: audit
        if: matrix.backend == 'surreal-backend'
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
