name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: surreal-backend
            features: "--no-default-features --features surreal-backend,embeddings"
          - backend: cozo-backend
            features: "--no-default-features --features cozo-backend,embeddings"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: fmt
        if: matrix.backend == 'surreal-backend'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy ${{ matrix.features }} --all-targets -- -D warnings -D clippy::pedantic

      - name: test
        if: matrix.backend == 'surreal-backend'
        run: cargo test ${{ matrix.features }} --all-targets

      - name: test (cozo-backend)
        if: matrix.backend == 'cozo-backend'
        # Non-advisory: run all cozo-backend tests except the two tests that
        # panic due to a known upstream bug in cozo-0.7.6 (U015-FLK1).
        # See "test (cozo-backend, advisory)" step below for those tests.
        run: cargo test ${{ matrix.features }} --all-targets -- --test-threads 1 --skip s_cs1_three_concurrent_health_checks_succeed --skip s_cs4_concurrent_indexing_serialised_by_in_progress_flag

      - name: test (cozo-backend, advisory)
        if: matrix.backend == 'cozo-backend'
        # Advisory: integration_concurrent_sessions tests s_cs1 and s_cs4 fail
        # due to an upstream `unwrap()` panic in cozo-0.7.6 storage/sqlite.rs:49
        # under concurrent daemon load (U015-FLK1). This cannot be fixed here;
        # tracked for follow-up (upgrade cozo or switch to WAL mode).
        continue-on-error: true
        run: cargo test ${{ matrix.features }} --test integration_concurrent_sessions -- --test-threads 1

      - name: audit
        if: matrix.backend == 'surreal-backend'
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
