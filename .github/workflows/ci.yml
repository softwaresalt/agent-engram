name: CI

# Trigger filtering (071-S): skip the Rust build on doc/backlog-only changes.
# `paths-ignore` uses all-match semantics — a push/PR is skipped ONLY when every
# changed file matches a pattern below. Any non-ignored file (**/*.rs, Cargo.toml,
# Cargo.lock, **/*.toml, .github/workflows/**, src/**, crates/**, scripts/**,
# examples/**) re-arms the FULL fmt → clippy → test → audit sequence, so code-PR
# coverage is never weakened.
#
# Markdown is SCOPED, not blanket: only doc markdown is ignored (docs/**, root
# *.md, .github/**/*.md, scripts/**/*.md). EXECUTABLE markdown re-arms CI on
# purpose — notably tests/**/*.md, i.e. the verify fixtures
# tests/fixtures/verify/{conformant,malformed}.md consumed by
# tests/integration/cli_verify_test.rs (asserting exit 0/1), plus any future
# crate README wired into the build via include_str!/doctests. A blanket **/*.md
# would under-run and let fixture breakage merge silently (adversarial-review P1;
# docs/closure/2026-07-04-ci-build-skip-adversarial-review.md).
#
# REQUIRED-CHECK CONTINGENCY: safe today only because `build` is NOT a required
# status check on `main`
# (docs/decisions/2026-07-04-ci-build-skip-required-check-spike.md). If `build` is
# ever promoted to a required status check, paths-ignore would make doc-only PRs
# hang on "Expected — Waiting for status to be reported"; at that point replace
# paths-ignore with a companion always-passing job publishing the same `build`
# check name (docs/exec-plans/2026-07-04-ci-build-skip-non-code-prs-plan.md).
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.backlogit/**'
      - 'docs/**'
      - '.autoharness/**'
      - '*.md'                # root README/CHANGELOG/AGENTS.md
      - '.github/**/*.md'     # instructions/prompts/agents
      - 'scripts/**/*.md'     # scripts/metrics/README.md
  pull_request:
    paths-ignore:
      - '.backlogit/**'
      - 'docs/**'
      - '.autoharness/**'
      - '*.md'                # root README/CHANGELOG/AGENTS.md
      - '.github/**/*.md'     # instructions/prompts/agents
      - 'scripts/**/*.md'     # scripts/metrics/README.md

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install toolchain
        # Pinned to an exact Rust/Clippy version (not floating `stable`) so
        # `-D warnings -D clippy::pedantic` is deterministic. Rust 1.98
        # introduced new lints (e.g. clippy::unused_async_trait_impl) that
        # fire across pre-existing src/db/cozo_queries.rs, src/server/state.rs,
        # and src/shim/transport.rs; upgrading to a newer pinned toolchain is
        # a deliberate follow-up (tracked as a backlog stash linked to PR
        # #346), not incidental CI drift. SHA is dtolnay/rust-toolchain
        # `master` HEAD: the action's README requires pinning to `master`
        # (not a version/`stable` branch tip) for the `toolchain:` input to
        # be honored.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.0"
          components: clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --no-default-features --features cozo-backend,embeddings --all-targets -- -D warnings -D clippy::pedantic

      - name: test
        # U015-FLK1 resolved (037-F): fd-lock covers DbInstance::new() and
        # run_schema_bootstrap(); startup auto-sync retries on SQLITE_BUSY.
        # Subprocess tests that require CozoDB 0.7.6 fix are annotated #[ignore]
        # (smoke_full_tool_chain_over_ipc, daemon_rehydrates_graph_and_vector_state_after_db_directory_is_deleted).
        # Tracked: stash 100EACD8; unblock on cozo >= 0.8.
        # Red-phase tests (s085-s088) marked #[ignore] until record_file_hash
        # is wired into index_workspace_inner.
        run: cargo test --no-default-features --features cozo-backend,embeddings --all-targets

      - name: audit
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit

  start-launcher-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install toolchain
        # Pinned to the same exact Rust 1.97.0 toolchain as the `build` job
        # (see that job's Install toolchain comment for rationale) so both
        # jobs share a deterministic, reviewed compiler version.
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Test PowerShell launcher contract
        run: cargo test --test contract_start_launcher
