name: Release

on:
  push:
    # GitHub tag globs cannot express full SemVer 2.0.0 precisely, especially
    # once prerelease/build metadata is allowed. Keep the trigger numerically
    # scoped here and let validate-tag enforce the exact accepted format.
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Ensures partial platform failures abort the entire release (S056).
# A failed build job cancels all sibling jobs and prevents publish from running.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-24.04
    steps:
      - name: Validate semantic version tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: ${TAG}" >&2
            exit 1
          fi

  # ── Quality gate ─────────────────────────────────────────────────────────────
  test:
    name: Quality Gates
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned to the same exact Rust 1.97.0 toolchain as .github/workflows/ci.yml
        # (see that file's Install toolchain comment; PR #346 / backlog stash
        # B1024A34). Prevents the mandatory Clippy gate here from silently
        # picking up a newer floating `stable` and failing on lints not yet
        # reviewed for this codebase (e.g. clippy::unused_async_trait_impl
        # introduced in Rust/Clippy 1.98).
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --no-default-features --features cozo-backend,embeddings --all-targets -- -D warnings -D clippy::pedantic

      - name: Tests
        run: cargo test --locked --no-default-features --features cozo-backend,embeddings --all-targets

  # ── Changelog generation ─────────────────────────────────────────────────────
  # Runs in parallel with `test`. The generated changelog body is passed to
  # the publish job via job outputs. Requires git-cliff (T088).
  changelog:
    name: Generate Changelog
    needs: validate-tag
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - name: Checkout (full history for cliff)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Install git-cliff as a pre-built binary instead of using the Docker-based
      # action, which broke when Debian Buster (the action's base image) went EOL.
      - name: Install git-cliff
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2
        with:
          tool: git-cliff

      - name: Generate changelog with git-cliff
        id: cliff
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          BODY="$(git-cliff --latest --strip header 2>/dev/null || true)"
          if [ -z "$BODY" ]; then
            BODY="No changelog entries for this release."
          fi
          {
            printf '%s\n' "content<<CLIFF_EOF"
            printf '%s\n' "$BODY"
            printf '%s\n' "CLIFF_EOF"
          } >> "$GITHUB_OUTPUT"

  # ── Cross-platform release builds ────────────────────────────────────────────
  # fail-fast: true ensures a partial platform failure aborts the entire release.
  build:
    name: Build ${{ matrix.target }}
    needs: [validate-tag, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux x86_64 — pin ubuntu-24.04 so the runner glibc matches the
          # prebuilt ONNX Runtime binaries required by the embeddings feature.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary_suffix: ""
            use_cross: false

          # Windows x86_64 — native MSVC build
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary_suffix: ".exe"
            use_cross: false

          # macOS Apple Silicon — native ARM64 build on M-series runner
          # x86_64-apple-darwin is intentionally omitted: ONNX Runtime does not
          # provide the prebuilt binaries required by the default embeddings
          # feature set for macOS Intel release builds.
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary_suffix: ""
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned to the same exact Rust 1.97.0 toolchain as the `test` job
        # above and .github/workflows/ci.yml for deterministic cross-platform
        # release builds (see `test` job comment for rationale).
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}

      # Install `cross` for cross-compilation (T086).
      # Used when use_cross is true (e.g., additional Linux/ARM targets in future).
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@3235f8901fd37ffed0052b276cec25a362fb82e9 # v2
        with:
          tool: cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      # Build with cross when use_cross is true, otherwise use cargo directly
      - name: Build release binaries (cargo)
        if: "!matrix.use_cross"
        run: cargo build --locked --release --target ${{ matrix.target }} --bin engram

      - name: Build release binaries (cross)
        if: matrix.use_cross
        run: cross build --locked --release --target ${{ matrix.target }} --bin engram

      # ── Archive: Unix (.tar.gz) ──────────────────────────────────────────────
      - name: Prepare archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="engram-${TAG}-${{ matrix.target }}.tar.gz"
          STAGING="staging-${{ matrix.target }}"
          mkdir -p "${STAGING}"
          cp "target/${{ matrix.target }}/release/engram${{ matrix.binary_suffix }}" "${STAGING}/"
          cp README.md "${STAGING}/"
          cp LICENSE "${STAGING}/"
          tar -czf "${ARCHIVE_NAME}" -C "${STAGING}" .
          echo "ASSET=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      # ── Archive: Windows (.zip) ──────────────────────────────────────────────
      - name: Prepare archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME"
          $archiveName = "engram-$tag-${{ matrix.target }}.zip"
          $staging = "staging-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\engram${{ matrix.binary_suffix }}" "$staging\"
          Copy-Item "README.md" "$staging\"
          Copy-Item "LICENSE" "$staging\"
          Compress-Archive -Path "$staging\*" -DestinationPath $archiveName
          "ASSET=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engram-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  # ── GitHub Releases publish ───────────────────────────────────────────────────
  # Requires BOTH changelog and all build jobs to succeed before publishing.
  # If any build job failed, this job will not run (fail-fast enforced).
  release:
    name: Publish GitHub Release
    needs: [validate-tag, changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: artifacts/

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body: ${{ needs.changelog.outputs.body }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-pre') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
